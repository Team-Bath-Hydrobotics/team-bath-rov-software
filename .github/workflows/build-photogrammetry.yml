name: Build Photogrammetry Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "photogrammetry-backend/**"
      - ".github/workflows/build-photogrammetry.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: team-bath-hydrobotics/photogrammetry-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./photogrammetry-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify COLMAP binary
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} colmap help

      - name: Verify OpenMVS TextureMesh binary
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} /usr/local/bin/OpenMVS/TextureMesh --help 2>&1 | grep -q "Available options"

      - name: Verify OpenMVS DensifyPointCloud binary
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} /usr/local/bin/OpenMVS/DensifyPointCloud --help 2>&1 | grep -q "Available options"

      - name: Verify OpenMVS ReconstructMesh binary
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} /usr/local/bin/OpenMVS/ReconstructMesh --help 2>&1 | grep -q "Available options"

      - name: Verify API starts
        run: |
          docker run -d --name photogrammetry-test -p 8100:8100 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -s --max-time 2 http://localhost:8100/api/health | grep -q ok; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          docker logs photogrammetry-test
          exit 1
