[project]
name = "packet-simulator"
version = "0.1.0"
description = "ROV Telemetry and Video Stream Simulator"
authors = [{ name = "mbm60-max", email = "mbm60@bath.ac.uk" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "opencv-python>=4.8.0,<5",
    "numpy>=2.1.1,<3",
    "ffmpeg-python>=0.2.0,<0.3",
    "black>=25.11.0,<26",
    "common",
]

[dependency-groups]
dev = ["pytest>=7.4.0,<8"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
common = { path = "../common" }

[tool.uv.build-backend]
module-name = "simulators"
module-root = "src"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
