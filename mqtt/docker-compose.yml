services:
  hivemq:
    image: hivemq/hivemq-ce:latest
    container_name: mqtt-broker
    env_file:
      - ./PASSWORD
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8884:8884"
    volumes:
      - ./config.xml:/opt/hivemq/conf/config.xml:ro
      - ./keystore.jks:/opt/hivemq/conf/keystore.jks:ro
