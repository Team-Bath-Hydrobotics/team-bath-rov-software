[project]
name = "telemetry-processor"
version = "0.1.0"
description = "ROV Telemetry Preprocessor - aggregation, filtering (Kalman), and MQTT output"
authors = [{ name = "Team Bath Hydrobotics" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "paho-mqtt>=2.0.0,<3",
    "numpy>=2.1.1,<3",
    "jsonschema>=4.25.1,<5",
    "dotenv>=0.9.9,<0.10",
    "common",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "black>=24.0.0,<25",
    "flake8>=7.0.0,<8",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv"]
