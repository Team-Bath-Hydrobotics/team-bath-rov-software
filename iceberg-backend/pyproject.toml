[project]
name = "iceberg-backend"
version = "1.0.0"
description = "Iceberg threat calculator backend for Team Bath ROV — MATE 2026 Task 2.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
