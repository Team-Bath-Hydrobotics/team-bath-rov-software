[project]
name = "crab-detection"
version = "1.0.0"
description = "ROV Machine Learning"
authors = [{ name = "mc2862", email = "mc2862@bath.ac.uk" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "albumentations>=1.3.1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "transformers>=4.30.0",
    "timm>=0.9.0",
    "pillow>=9.5.0",
    "rfdetr>=1.6.3,<2",
    "supervision>=0.16.0",
    "tensorboard>=2.13.0",
    "fastapi>=0.135.3,<0.136",
    "uvicorn>=0.44.0,<0.45",
    "python-dotenv>=1.0.1,<2",
]

[tool.uv]
package = false
